{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} customer{% endblock %}
{% block content %}
<div class="page-head"><h1 class="page-title">{{ 'Edit customer' if editing else 'Add customer' }}</h1></div>
<form method="post" class="panel form-panel">
  <div class="mb-3"><label class="form-label">Name</label>
    <input class="form-control" name="name" maxlength="100" required value="{{ customer.name or '' }}"></div>
  <div class="mb-3"><label class="form-label">Contact (phone or email)</label>
    <input class="form-control" name="contact" maxlength="100" required value="{{ customer.contact or '' }}"></div>
  <div><button class="btn btn-primary">Save customer</button>
    <a class="btn btn-link" href="{{ url_for('customers') }}">Cancel</a></div>
</form>
{% endblock %}
